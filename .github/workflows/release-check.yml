name: release-check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact current main commit to validate
        required: true
        type: string
      version:
        description: Package version without a v prefix
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0
      - name: Fetch authoritative main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify release identity
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref_name }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: node scripts/verify-release.mjs --ref "$RELEASE_REF" --version "$RELEASE_VERSION"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:self-contained
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run prepare
      - run: node --input-type=module -e "import('./lib/index.js').then((m) => { if (m.default || m.name !== 'dsh-as-a-verifier') process.exit(1) })"
      - name: Verify exact Git installation
        env:
          INSTALL_REF: ${{ inputs.ref || github.ref_name }}
        run: node scripts/git-install-smoke.mjs --ref "$INSTALL_REF"
      - name: Verify tracked files remain clean
        run: test -z "$(git status --porcelain)"
