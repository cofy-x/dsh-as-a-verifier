name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:self-contained
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run prepare
      - run: node --input-type=module -e "import('./lib/index.js').then((m) => { if (m.default || m.name !== 'dsh-as-a-verifier') process.exit(1) })"

  git-install-smoke:
    name: git-install-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install exact Git revision
        env:
          INSTALL_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/git-install-smoke.mjs --ref "$INSTALL_REF"

  required:
    name: required
    if: ${{ always() }}
    needs: [quality, git-install-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SMOKE_RESULT: ${{ needs.git-install-smoke.result }}
        run: test "$QUALITY_RESULT" = success && test "$SMOKE_RESULT" = success
